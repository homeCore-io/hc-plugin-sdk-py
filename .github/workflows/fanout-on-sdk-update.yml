name: Fan out SDK updates

# Mirror of homeCore-io/hc-plugin-sdk-rs's fanout workflow. When this
# Python SDK lands a develop-branch commit, dispatch a release on
# every dependent plugin repo so their dev images rebuild against
# the new SDK at the same develop SHA.
#
# As of writing, no Python plugins exist in the homeCore-io org, so
# the matrix is empty and the fanout job is gated off. When the
# first Python plugin lands:
#   1. Add it to the matrix.plugin list below
#   2. Remove the `if: vars.FANOUT_ENABLED == 'true'` gate (or set the
#      FANOUT_ENABLED repo variable to 'true')
#   3. Confirm SDK_FANOUT_PAT secret is present and scoped to that plugin's repo
#
# Auth: needs SDK_FANOUT_PAT — same shape as the Rust SDK's PAT
# (actions:write on each dependent plugin repo).

on:
  # push trigger disabled until the first Python plugin lands. With
  # an empty matrix below, GitHub Actions spawns zero jobs on push
  # and marks the run as failed (matrix expansion happens before
  # the `if: vars.FANOUT_ENABLED` gate). When the first Python
  # plugin lands, restore the push block:
  #   push:
  #     branches: [develop]
  #     paths:
  #       - 'homecore_plugin_sdk/**'
  #       - 'pyproject.toml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fanout-sdk
  cancel-in-progress: true

jobs:
  fanout:
    name: Dispatch ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    # Disabled until the first Python plugin is registered. Flip the
    # FANOUT_ENABLED repo variable to 'true' (Settings → Secrets and
    # variables → Actions → Variables) once the matrix has entries.
    if: vars.FANOUT_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        plugin: []   # ← add Python plugin repo names here
    env:
      GH_TOKEN: ${{ secrets.SDK_FANOUT_PAT }}
    steps:
      - name: Pre-flight — token present
        run: |
          if [ -z "${{ secrets.SDK_FANOUT_PAT }}" ]; then
            echo "::error::SDK_FANOUT_PAT secret not set."
            exit 1
          fi
      - name: Dispatch release on plugin repo
        run: |
          set -eux
          gh workflow run release.yml \
            --repo "homeCore-io/${{ matrix.plugin }}" \
            --ref develop \
            -F fast=true
