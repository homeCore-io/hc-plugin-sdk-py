[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "homecore-plugin-sdk"
version     = "0.2.0"
description = "Python SDK for HomeCore device plugins"
readme      = "README.md"
requires-python = ">=3.11"
license     = { text = "MIT OR Apache-2.0" }

dependencies = [
    # >=2.0 for CallbackAPIVersion.VERSION2, which the client is built with.
    "paho-mqtt>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["homecore_plugin_sdk*"]
